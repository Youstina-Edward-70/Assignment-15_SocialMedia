@if (isOpen() && imageUrl()) {
<div (click)="close()"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm transition-all">
  <button (click)="close()" type="button"
    class="absolute top-5 right-5 z-50 text-white bg-white/10 hover:bg-white/20 rounded-full w-11 h-11 flex items-center justify-center transition-colors cursor-pointer border border-white/20"
    aria-label="Close image preview">
    <i class="fa-solid fa-xmark text-xl"></i>
  </button>

  <div class="relative max-w-5xl max-h-[90vh] overflow-hidden flex items-center justify-center"
    (click)="$event.stopPropagation()">
    <img [src]="imageUrl()"
      class="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl border border-white/10"
      [alt]="altText()" />
  </div>
</div>
}
